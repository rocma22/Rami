<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rami score</title>
<style>
:root{--bg:#e9efe9;--card:#fff;--ink:#14261d;--mute:#5d6f64;--line:#cdd8cf;--felt:#15402f;--chalk:#f4f2ea;--brass:#b8892b;--red:#b83a30;--ok:#1f7a4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a14;--card:#16281f;--ink:#eef2ec;--mute:#9db0a4;--line:#2a4034;--felt:#0a2a1e;--brass:#d6a84a;--red:#ef6b5e;--ok:#4fc08a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a14;--card:#16281f;--ink:#eef2ec;--mute:#9db0a4;--line:#2a4034;--felt:#0a2a1e;--brass:#d6a84a;--red:#ef6b5e;--ok:#4fc08a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--felt);color:var(--chalk);cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.stack>*+*{margin-top:10px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pl{background:var(--felt);color:var(--chalk);border-radius:14px;padding:12px 14px;position:relative}
.pl .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .s{font:700 44px/1.05 Georgia,serif;margin:2px 0}
.pl .m{font-size:13px;opacity:.8}
.pl.warn{background:#ffb74d;color:#2b1500}
.pl.warn .bar{background:rgba(43,21,0,.22)}
.pl.warn .bar i{background:#2b1500}
.pl.warn .m,.pl.danger .m{opacity:1;font-weight:600}
.pl.danger{background:#b71c1c;color:#fff;box-shadow:0 0 0 3px #ff8a80 inset}
.pl.danger .bar{background:rgba(255,255,255,.3)}
.pl.danger .bar i{background:#fff}
.pl.sc{box-shadow:0 0 0 4px #f2c230}
.pay{font-weight:700;color:var(--red);margin-top:6px}
.pl.out{background:#fde2e0;color:#7a1c15}
.pl.out .bar{background:rgba(122,28,21,.2)}
.pl.out .bar i{background:#7a1c15}
.pl.out .m{opacity:1;font-weight:600}
.pl.win{background:#d8f2e3;color:#0b3d24}
.pl.win .bar{background:rgba(11,61,36,.2)}
.pl.win .bar i{background:#0b3d24}
.pl.win .m{opacity:1;font-weight:600}
.res{padding:10px 12px;border-radius:10px;margin-top:8px}
.res.win{background:#d8f2e3;color:#0b3d24}
.res.lose{background:#fde2e0;color:#7a1c15;border:1px solid #f3a9a3}
.res.lose .pay{color:#7a1c15;margin-top:6px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.who{display:grid;grid-template-columns:1fr 64px 90px;gap:8px;align-items:center}
.who label.t{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700}
.who input[type=radio]{width:22px;height:22px;accent-color:var(--brass)}
.who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.hd{color:var(--mute);font-size:13px}
.note{background:var(--bg);border-left:4px solid var(--brass);padding:10px 12px;border-radius:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--mute)}
td.t{font-weight:700;color:var(--ok)}
.scroll{overflow-x:auto}
.err{color:var(--red);font-size:14px;min-height:20px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;padding:10px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.seg button.on{background:var(--felt);color:var(--chalk)}
.board.n3 .pl:last-child{grid-column:1/-1}
.lang{max-width:520px;margin:0 auto;padding:12px 16px 0;display:flex;gap:6px;justify-content:flex-end}
.lang button{padding:6px 12px;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.lang button.on{background:var(--felt);color:var(--chalk)}
[dir=rtl] .note{border-left:0;border-right:4px solid var(--brass)}
[dir=rtl] th:first-child,[dir=rtl] td:first-child{text-align:right}
</style>
<style>body.view .card.stack,body.view .row{display:none}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<main id="app"></main>
<script>
var LIMIT=52,KEY="rami-score-v1";
var S;

var LANGS={en:"EN",fr:"FR",ar:"دارجة"};
var I={
en:{title:"Rami score",intro:"One person keeps the score for four players. Reaching {0} points means out; {1} is still safe.",player:"Player",start:"Start game",togo:"{0} to go",careful:"Careful, {0} to go",danger:"Danger! {0} to go",tiebreak:"Tiebreak",winner:"Winner",lost:"Lost",sc:"2nd chance used",round:"Round {0}",colplayer:"Player",colpts:"Card points",wentout:"{0} went out",addround:"Add round",errT:"Choose who went out (T).",errPts:"Enter card points for {0}.",tietitle:"Tiebreak round",tieq:"Who went out first?",tiebtn:"{0} went out (T)",gameover:"Game over",winners:"Winners",loser:"Loser",losers:"Losers",and:" and ",pays:"{0} pays {1} DH",rounds:"Rounds",tie:"Tie",undo:"Undo last round",newgame:"New game",sure:"Tap again to erase scores",share:"Share live with players",shareoff:"Live sharing is off. Add your Firebase settings in the file.",sharehint:"Players open this link:",waiting:"Waiting for the scorer…",notset:"Live view is not set up.",liveview:"Live view, read-only",
players:"Number of players",limitlabel:"Points limit",custom:"Custom",customph:"Enter points (10-999)",errLimit:"Enter a whole number between 10 and 999.",logRound:"Round added.",logAgain:"{0} went over {1} again after the second chance and loses the game.",logSecond:"{0} reached {1} and gets a second chance: score reset to {2} (highest of the others, {3}).",logTwo:"{0} and {1} went over {2} and lose.",logThree:"{0} players went over at once. They play one more round: the first to go out wins.",logTie:"{0} won the tiebreak and wins with {1}."},
fr:{title:"Score Rami",intro:"Une seule personne compte les points des quatre joueurs. À {0} points, le joueur est éliminé ; {1} est encore sauf.",player:"Joueur",start:"Commencer la partie",togo:"encore {0}",careful:"Attention, encore {0}",danger:"Danger ! encore {0}",tiebreak:"Départage",winner:"Gagnant",lost:"Perdu",sc:"2e chance utilisée",round:"Manche {0}",colplayer:"Joueur",colpts:"Points des cartes",wentout:"{0} a fini",addround:"Ajouter la manche",errT:"Choisis qui a fini (T).",errPts:"Entre les points de {0}.",tietitle:"Manche de départage",tieq:"Qui a fini en premier ?",tiebtn:"{0} a fini (T)",gameover:"Partie terminée",winners:"Gagnants",loser:"Perdant",losers:"Perdants",and:" et ",pays:"{0} paie {1} DH",rounds:"Manches",tie:"Dép.",undo:"Annuler la dernière manche",newgame:"Nouvelle partie",sure:"Appuie encore pour effacer",share:"Partager en direct",shareoff:"Le partage en direct est désactivé. Ajoute tes réglages Firebase dans le fichier.",sharehint:"Les joueurs ouvrent ce lien :",waiting:"En attente de celui qui compte…",notset:"La vue en direct n’est pas configurée.",liveview:"Vue en direct, lecture seule",
players:"Nombre de joueurs",limitlabel:"Limite de points",custom:"Autre",customph:"Entre les points (10-999)",errLimit:"Entre un nombre entier entre 10 et 999.",logRound:"Manche ajoutée.",logAgain:"{0} a dépassé {1} après sa seconde chance et perd la partie.",logSecond:"{0} a atteint {1} et obtient une seconde chance : son score passe à {2} (le plus haut des autres, {3}).",logTwo:"{0} et {1} ont dépassé {2} et perdent.",logThree:"{0} joueurs ont dépassé la limite en même temps. Ils jouent une manche de plus : le premier qui finit gagne.",logTie:"{0} gagne le départage et gagne avec {1}."},

players:"شحال د اللاعبين",limitlabel:"الحد د النقاط",custom:"حدد نتا",customph:"دخل النقاط (10-999)",errLimit:"دخل رقم صحيح بين 10 و999.",logRound:"تزاد الدور.",logAgain:"{0} فات {1} مرة أخرى من بعد الفرصة الثانية وخسر اللعبة.",logSecond:"{0} وصل {1} وعطيناه فرصة ثانية: نقاطو رجعو {2} (أعلى نقطة عند الآخرين، {3}).",logTwo:"{0} و{1} فاتو {2} وخسرو.",logThree:"{0} د اللاعبين فاتو الحد فنفس الوقت. غادي يلعبو دور زايد: اللي سلّى الأول كيربح.",logTie:"{0} ربح الحسم وربح مع {1}."}
};
var lang="";
try{lang=localStorage.getItem("rami-lang")||""}catch(e){}
if(!I[lang]){var nl=(navigator.language||"en").slice(0,2);lang=I[nl]?nl:"en"}
function t(k){var a=arguments;var s=I[lang][k];if(s===undefined)s=I.en[k];if(s===undefined)s=k;return String(s).replace(/\{(\d)\}/g,function(m,n){return a[+n+1]!==undefined?a[+n+1]:m})}
function logk(k){S.log.push({k:k,a:[].slice.call(arguments,1)})}
function logText(x){return(x&&typeof x==="object")?t.apply(null,[x.k].concat(x.a||[])):String(x)}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  var h="";for(var k in LANGS)h+='<button class="'+(k===lang?"on":"")+'" onclick="setLang(\''+k+'\')">'+LANGS[k]+'</button>';
  var el=document.getElementById("lang");if(el)el.innerHTML=h;
}
function setLang(l){lang=l;try{localStorage.setItem("rami-lang",l)}catch(e){}applyLang();render()}
applyLang();

var S=load()||{screen:"setup",names:["","","",""],n:4,limit:52,custom:false};
if(S.limit&&S.screen!=="setup")LIMIT=S.limit;
function Z(n,v){var a=[];for(var i=0;i<n;i++)a.push(v);return a}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(id){return document.getElementById(id)};
var err="";

function render(){
  var h="";
  if(S.screen==="setup")h=setupView();else h=gameView();
  $("app").innerHTML=h;
}
function grabNames(){
  for(var i=0;i<4;i++){var e=$("n"+i);if(e)S.names[i]=e.value}
  var c=$("cl");if(c&&S.custom){var v=parseInt(c.value,10);S.limit=isNaN(v)?"":v}
}
function setN(n){grabNames();err="";S.n=n;save();render()}
function setLim(v){grabNames();err="";S.limit=v;S.custom=false;save();render()}
function setCustom(){grabNames();err="";S.custom=true;if([52,72,102].indexOf(S.limit)>-1)S.limit="";save();render()}
function setupView(){
  var n=S.n||4,lim=S.limit,f="",nb="",lb="";
  for(var k=2;k<=4;k++)nb+='<button class="'+(k===n?"on":"")+'" onclick="setN('+k+')">'+k+'</button>';
  [52,72,102].forEach(function(v){lb+='<button class="'+(!S.custom&&lim===v?"on":"")+'" onclick="setLim('+v+')">'+v+'</button>'});
  lb+='<button class="'+(S.custom?"on":"")+'" onclick="setCustom()">'+t("custom")+'</button>';
  for(var i=0;i<n;i++)f+='<input type="text" id="n'+i+'" maxlength="14" placeholder="'+t("player")+' '+(i+1)+'" value="'+esc(S.names[i]||"")+'" autocomplete="off">';
  var cu=S.custom?'<input type="number" inputmode="numeric" id="cl" min="10" max="999" placeholder="'+t("customph")+'" value="'+esc(lim===""||lim==null?"":lim)+'">':'';
  return '<h1>'+t("title")+'</h1><p class="sub">'+t("intro",lim||52,(lim||52)-1)+'</p>'+
  '<div class="card stack"><b>'+t("players")+'</b><div class="seg">'+nb+'</div><b>'+t("limitlabel")+'</b><div class="seg">'+lb+'</div>'+cu+f+'<div class="err" id="err">'+err+'</div><button class="full" onclick="startGame()">'+t("start")+'</button></div>';
}
function startGame(){
  grabNames();
  var n=S.n||4,lim=parseInt(S.limit,10);
  if(isNaN(lim)||lim<10||lim>999){err=t("errLimit");render();return}
  var names=[];
  for(var i=0;i<n;i++){var v=(S.names[i]||"").trim();names.push(v||(t("player")+" "+(i+1)))}
  LIMIT=lim;
  S={screen:"game",names:names,limit:lim,custom:!!S.custom,scores:Z(n,0),outs:Z(n,0),used:Z(n,false),rounds:[],log:[],phase:"play",over:[],winners:[],losers:[]};
  err="";hist=[];saveHist();save();render();
}
function gameView(){
  var h='<h1>'+t("title")+'</h1>';
  var over=S.phase==="play"?S.scores.map(function(s,i){return s>=LIMIT?i:-1}).filter(function(i){return i>=0}):[];
  h+='<div class="board n'+S.names.length+'">';
  var dz=Math.max(2,Math.round(LIMIT*.06)),wz=Math.max(4,Math.round(LIMIT*.135));
  for(var i=0;i<S.names.length;i++){
    var cls="pl",st="";
    if(S.phase==="done"){if(S.winners.indexOf(i)>-1){cls+=" win";st=t("winner")}else{cls+=" out";st=t("lost")}}
    else if(S.phase==="tiebreak"&&S.over.indexOf(i)>-1){cls+=" danger";st=t("tiebreak")}
    else if(LIMIT-S.scores[i]<=dz){cls+=" danger";st=t("danger",LIMIT-S.scores[i])}
    else if(LIMIT-S.scores[i]<=wz){cls+=" warn";st=t("careful",LIMIT-S.scores[i])}
    else st=t("togo",LIMIT-S.scores[i]);
    if(S.used&&S.used[i]&&S.phase!=="done")cls+=" sc";
    var pct=Math.min(100,S.scores[i]/LIMIT*100);
    h+='<div class="'+cls+'"><div class="n">'+esc(S.names[i])+'</div><div class="s">'+S.scores[i]+'</div><div class="m">T × '+S.outs[i]+' · '+st+(S.used&&S.used[i]&&S.phase!=="done"?' · '+t("sc"):'')+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }
  h+='</div>';
  if(S.log.length)h+='<div class="note">'+esc(logText(S.log[S.log.length-1]))+'</div>';
  if(S.phase==="play")h+=roundForm();
  else if(S.phase==="tiebreak")h+=tieView();
  else h+=doneView();
  h+=history();
  h+='<div class="row" style="margin-top:12px"><button class="alt" onclick="undo()" '+(hist.length?"":"disabled")+'>'+t("undo")+'</button><button class="alt" onclick="newGame()">'+(sure?t("sure"):t("newgame"))+'</button></div>';
  return h;
}
function roundForm(){
  var h='<div class="card stack"><b>'+t("round",S.rounds.length+1)+'</b><div class="who hd"><span>'+t("colplayer")+'</span><span style="text-align:center">T</span><span>'+t("colpts")+'</span></div>';
  for(var i=0;i<S.names.length;i++)h+='<div class="who"><span class="nm">'+esc(S.names[i])+'</span><label class="t"><input type="radio" name="t" value="'+i+'" onchange="pickT()" aria-label="'+esc(t("wentout",S.names[i]))+'"></label><input type="number" inputmode="numeric" min="0" id="p'+i+'" placeholder="0"></div>';
  h+='<div class="err" id="err">'+err+'</div><button class="full" onclick="addRound()">'+t("addround")+'</button></div>';
  return h;
}
function pickT(){
  var tr=document.querySelector('input[name=t]:checked');if(!tr)return;
  for(var i=0;i<S.names.length;i++){var el=$("p"+i);el.disabled=(+tr.value===i);if(el.disabled)el.value=""}
}
function addRound(){
  var tr=document.querySelector('input[name=t]:checked'),n=S.names.length;
  if(!tr){err=t("errT");render();return}
  var T=+tr.value,pts=Z(n,0);
  for(var i=0;i<n;i++){if(i===T)continue;var v=parseInt($("p"+i).value,10);if(isNaN(v)||v<0){err=t("errPts",S.names[i]);render();return}pts[i]=v}
  err="";
  snapshot();
  for(i=0;i<n;i++)S.scores[i]+=pts[i];
  S.outs[T]++;
  S.rounds.push({t:T,pts:pts,after:S.scores.slice()});
  evaluate();
  save();render();
}
function evaluate(){
  var over=[],under=[];
  for(var i=0;i<S.names.length;i++)(S.scores[i]>=LIMIT?over:under).push(i);
  if(over.length===0){logk("logRound");return}
  if(over.length===1){
    var p=over[0],best=0,bi=-1;
    if(S.used&&S.used[p]){S.phase="done";S.losers=[p];S.winners=under;logk("logAgain",S.names[p],LIMIT-1);return}
    if(!S.used)S.used=Z(S.names.length,false);
    S.used[p]=true;
    under.forEach(function(j){if(S.scores[j]>best||bi<0){best=S.scores[j];bi=j}});
    logk("logSecond",S.names[p],S.scores[p],best,S.names[bi]);
    S.scores[p]=best;return;
  }
  if(over.length===2){
    S.phase="done";S.losers=over;S.winners=under;
    logk("logTwo",S.names[over[0]],S.names[over[1]],LIMIT-1);return;
  }
  S.phase="tiebreak";S.over=over;S.under=under;
  logk("logThree",over.length);
}
function tieView(){
  var h='<div class="card stack"><b>'+t("tietitle")+'</b><span class="hd">'+t("tieq")+'</span>';
  S.over.forEach(function(i){h+='<button class="full" onclick="tieWin('+i+')">'+esc(t("tiebtn",S.names[i]))+'</button>'});
  return h+'</div>';
}
function tieWin(i){
  snapshot();
  S.outs[i]++;
  S.winners=S.under.concat([i]);
  S.losers=S.names.map(function(x,k){return k}).filter(function(k){return S.winners.indexOf(k)<0});
  S.phase="done";
  logk("logTie",S.names[i],S.under.map(function(k){return S.names[k]}).join(", "));
  S.rounds.push({t:i,pts:Z(S.names.length,0),after:S.scores.slice(),tie:true});
  save();render();
}
function doneView(){
  var nm=function(i){return esc(S.names[i])},sep=t("and");
  return '<div class="card"><b>'+t("gameover")+'</b><div class="res win">'+(S.winners.length>1?t("winners"):t("winner"))+': '+S.winners.map(nm).join(sep)+'</div><div class="res lose"><b>'+(S.losers.length>1?t("losers"):t("loser"))+': '+S.losers.map(nm).join(sep)+'</b>'+S.losers.map(function(i){return '<div class="pay">'+esc(t("pays",S.names[i],10/S.losers.length))+'</div>'}).join("")+'</div></div>';
}
function history(){
  if(!S.rounds.length)return "";
  var h='<div class="card scroll"><b>'+t("rounds")+'</b><table><tr><th></th>'+S.names.map(function(n){return"<th>"+esc(n)+"</th>"}).join("")+"</tr>";
  S.rounds.forEach(function(r,k){
    h+="<tr><td>"+(r.tie?t("tie"):k+1)+"</td>";
